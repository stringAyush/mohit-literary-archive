# Calls the site's scheduler every 15 minutes so scheduled works are published on time.
# Add two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://your-site.example
#   CRON_SECRET  the same value as CRON_SECRET in the site's environment
name: Publish scheduled works

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduler endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-scheduled"
